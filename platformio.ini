; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-cores3

[env]
monitor_echo = true
monitor_filters = time, send_on_enter, esp32_exception_decoder, default
extra_scripts = post:extra_script_post.py
board_build.embed_files = x509_crt_bundle
platform = espressif32
framework = arduino

[env:m5stack-cores3]
board = m5stack-cores3
upload_speed = 1500000
monitor_speed = 115200
build_flags =
#    -DARDUINO_USB_MODE=1
#    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=4
    -DLV_CONF_PATH=\"${platformio.include_dir}/lv_conf.h\"
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    meganetaaan/M5Stack-Avatar@^0.10.0
    m5stack/M5Unified
    robotis-git/Dynamixel2Arduino@^0.7.0
    vrekrer/Vrekrer SCPI parser@^0.5.0
    lvgl/lvgl@^9.5.0
    links2004/WebSockets@^2.6.1
#    tobozo/M5Stack-SD-Updater@^1.2.8

